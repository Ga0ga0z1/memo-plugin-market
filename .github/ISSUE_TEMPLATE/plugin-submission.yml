name: 社区插件投稿
description: 申请审核一个已由作者签名发布的插件版本。
title: "[插件投稿] "
body:
  - type: markdown
    attributes:
      value: |
        一份投稿对应一个正式 Release 中的一个插件版本。字段均为公开信息。请使用示例数据描述测试，私钥、令牌、设备标识和真实笔记请留在本地。[投稿说明](https://github.com/Ga0ga0z1/memo-plugin-market/blob/main/CONTRIBUTING.md)
  - type: input
    id: identity
    attributes:
      label: 发布者 ID、插件 ID 和 versionCode
      placeholder: "example.author / example.format / 1"
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: 作者仓库的正式 Release
      description: 填写指向精确 tag 的公开 GitHub 发布页。
      placeholder: "https://github.com/OWNER/REPO/releases/tag/v1.0.0"
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: 插件资产与发布者公钥
      description: 写明 .memoplugin 与 DER 公钥在 Release 中的准确文件名、整包 SHA-256、公钥 SHA-256 和公钥指纹的独立核对渠道。原生伴生插件另列 APK 的下载链接、包名和签名证书 SHA-256。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 源码、构建方法与许可证
      description: 提供源码固定提交的公开链接、复现构建的命令或说明链接，以及该版本适用许可证的名称或链接。
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: 展示名、用途、权限及数据去向
      description: 逐项说明权限用途、读取和写入哪些数据、存储和发送位置。没有申请权限或没有外发时可直接写明。更新时指出与上一版本的差异。
    validations:
      required: true
  - type: textarea
    id: execution
    attributes:
      label: 手机端任务由谁执行
      description: 仅在页面内运行、调用现有短操作，或只在作者服务器上定时生成内容，可直接这样说明。需要切应用或熄屏后继续的手机任务，请逐项列出触发入口、宿主适配器、最低拓展版 versionCode 和支持该适配器的发行说明。
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: 试装环境与复现步骤
      description: 写出试装版本、入口、示例输入及结果。有伴生 APK 时给出安装顺序和桌面入口用途。提交手机后台任务时，附上停止伴生进程并熄屏后由宿主完成任务的记录，以及重开插件回读同一结果的步骤。
    validations:
      required: true
